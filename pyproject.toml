[project]
name = "fastapi-users-oidc"
version = "0.1.1"
description = "Shared fastapi-users auth layer with OIDC support"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi-users[sqlalchemy,oauth]>=15.0.4",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.128.4",
    "fastapi-mail>=1.6.1",
    "httpx>=0.28.1",
    "httpx-oauth>=0.16",
    "jinja2>=3.1",
    "sqladmin[full]>=0.23.0",
    "sqlalchemy[asyncio]>=2.0.46",
    "click>=8.2",
    "tabulate>=0.9",
]

[project.optional-dependencies]
resend = ["resend>=2.21.0"]
dev = [
    "asyncpg>=0.31.0",
    "pytest>=9.0.2",
    "pytest-xdist>=3.8.0",
    "python-dotenv>=1.2.1",
    "ruff>=0.9.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fastapi_users_oidc"]

[[tool.uv.index]]
name = "homelab"
url = "http://gitea.homelab.internal/api/packages/admin/pypi/simple/"
publish-url = "http://gitea.homelab.internal/api/packages/admin/pypi"
explicit = true

[tool.ruff]
line-length = 90
target-version = "py312"

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint.isort]
case-sensitive = true
lines-between-types = 1
lines-after-imports = 2
